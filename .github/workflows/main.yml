name: Publicar noticias LVBP

on:
  schedule:
    # Cada 6 horas: 00:00, 06:00, 12:00, 18:00 UTC
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          
      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests json5
          
      - name: Ejecutar bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: python bot.py
        
      - name: Guardar historial
        run: |
          # Crear vistos.json si no existe
          if [ ! -f vistos.json ]; then
            echo '{"noticias": [], "resultados": "", "posiciones": "", "calendario": ""}' > vistos.json
            echo "⚠️ vistos.json no existía. Se creó automáticamente."
          fi
          
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add vistos.json
          git commit -m "Actualizar historial de noticias" || echo "Sin cambios"
          git push
