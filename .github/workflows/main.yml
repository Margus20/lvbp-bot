name: Publicar noticias LVBP

on:
  schedule:
    # Cada 6 horas: 00:00, 06:00, 12:00, 18:00 UTC
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente desde la pestaña Actions

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          
      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: 📦 Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests json5
          
      - name: 🤖 Ejecutar bot modular
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: python main.py
        
      - name: 💾 Guardar historial (vistos.json)
        run: |
          # Crear vistos.json con la estructura correcta si no existe
          if [ ! -f vistos.json ]; then
            echo '{"noticias": [], "resultados": [], "posiciones": "", "calendario": ""}' > vistos.json
            echo "⚠️ vistos.json no existía. Se creó automáticamente."
          fi
          
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add vistos.json
          git commit -m "🤖 Actualizar historial de publicaciones del bot" || echo "Sin cambios en vistos.json"
          git push
