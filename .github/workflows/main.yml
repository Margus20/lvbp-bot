name: Publicar noticias LVBP

on:
  schedule:
    # Se ejecuta una vez al día a las 16:00 UTC, que equivale a las 12:00 PM (Mediodía) en Venezuela (UTC-4)
    - cron: '0 16 * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente desde la pestaña Actions para hacer pruebas

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          
      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: 📦 Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests json5 Pillow
          
      - name: 🤖 Ejecutar bot modular
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: python main.py
        
      - name: 💾 Guardar historial (vistos.json)
        run: |
          # Crear vistos.json con la estructura correcta si no existe
          if [ ! -f vistos.json ]; then
            echo '{"resultados": [], "posiciones": "", "calendario": "", "noticias_ids": [], "estadisticas": "", "fecha_publicidad": null, "fecha_noticias": null, "fecha_estadisticas": null}' > vistos.json
            echo "⚠️ vistos.json no existía. Se creó automáticamente con la estructura actualizada."
          fi
          
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add vistos.json
          git commit -m "🤖 Actualizar historial de publicaciones del bot (vistos.json)" || echo "Sin cambios en vistos.json"
          git push
