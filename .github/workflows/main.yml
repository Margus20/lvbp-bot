name: Publicar noticias LVBP

on:
  schedule:
    # 8:00 AM Venezuela (12:00 PM UTC)
    - cron: '0 12 * * *'
    # 1:00 PM Venezuela (5:00 PM UTC)
    - cron: '0 17 * * *'
    # 5:00 PM Venezuela (9:00 PM UTC)
    - cron: '0 21 * * *'
    # 2:00 AM Venezuela (6:00 AM UTC del mismo día)
    - cron: '0 6 * * *'
  
  # Esto te permite ejecutarlo manualmente cuando quieras probar
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    
    steps:
    - name: Clonar repositorio
      uses: actions/checkout@v3
      
    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Instalar dependencias
      run: |
        pip install requests
        pip install beautifulsoup4
      
    - name: Ejecutar bot
      env:
        BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      run: python bot.py
