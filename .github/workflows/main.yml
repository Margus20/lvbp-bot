name: Publicar noticias LVBP

on:
  schedule:
    # Cada 6 horas: 00:00, 06:00, 12:00, 18:00 UTC
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          
      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests
          
      - name: Ejecutar bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: python bot.py
        
      - name: Guardar historial
        run: |
          # 1. VERIFICAR Y CREAR: Si vistos.json no existe, lo crea vacío
          if [ ! -f vistos.json ]; then
            echo "[]" > vistos.json
            echo "⚠️ El archivo vistos.json no existía. Se ha creado automáticamente."
          fi
          
          # 2. CONFIGURAR GIT
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # 3. AGREGAR, COMMIT Y PUSH
          # El "|| echo" al final evita que el workflow falle si no hay cambios nuevos
          git add vistos.json
          git commit -m "Actualizar historial de noticias" || echo "Sin cambios nuevos para guardar"
          git push
