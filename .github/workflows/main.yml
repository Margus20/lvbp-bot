name: Publicar resultados LVBP

on:
  schedule:
    # Se ejecuta todos los días a las 6:00 AM UTC (2:00 AM Venezuela)
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    
    steps:
    - name: Clonar repositorio
      uses: actions/checkout@v3
      
    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Instalar dependencias
      run: |
        pip install requests
        pip install beautifulsoup4
        pip install lxml
      
    - name: Ejecutar bot
      env:
        BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      run: python bot.py
