name: Publicar noticias LVBP

on:
  schedule:
    - cron: '0 8,14,20 * * *'
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v3
        
      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Instalar dependencias y navegador invisible
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 playwright lxml
          playwright install chromium
          playwright install-deps chromium
          
      - name: Ejecutar bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: python bot.py
        
      - name: Guardar historial de noticias
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add vistos.txt
          git commit -m "Actualizar historial de noticias" || echo "Sin cambios"
          git push
